services:
  gst-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "4192"
    ports:
      - "4192:4192"
    environment:
      - KRUTRIM_API_KEY=${KRUTRIM_API_KEY:-}
      - APP_API_KEY=${APP_API_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PORT=${PORT:-4192}
    restart: unless-stopped
